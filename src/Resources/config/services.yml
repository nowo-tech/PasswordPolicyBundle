services:
  _defaults:
    # automatically injects dependencies in your services
    autowire: true
    # automatically registers your services as commands, event subscribers, etc.
    autoconfigure: true
    # this means you cannot fetch services directly from the container via $container->get()
    # if you need to do this, you can override this setting on individual services
    public: false


  Nowo\PasswordPolicyBundle\Service\:
    resource: '../../Service/*'

  Nowo\PasswordPolicyBundle\Validator\PasswordPolicyValidator:
    autowire: true

  # Exclude PasswordExpiryListener from autodiscovery to prevent autowiring issues
  # It will be registered manually in PasswordPolicyExtension with all arguments
  Nowo\PasswordPolicyBundle\EventListener\PasswordExpiryListener:
    autowire: false
    autoconfigure: false
    public: false

  Nowo\PasswordPolicyBundle\Service\PasswordExpiryService:
    arguments:
      $tokenStorage: '@security.token_storage'

  # DDD / hexagonal ports: alias the interfaces to your own adapters to replace the defaults.
  Nowo\PasswordPolicyBundle\History\DoctrinePasswordHistoryRepository:
    arguments:
      $managerRegistry: '@?doctrine'

  Nowo\PasswordPolicyBundle\History\PasswordHistoryRepositoryInterface:
    alias: Nowo\PasswordPolicyBundle\History\DoctrinePasswordHistoryRepository

  Nowo\PasswordPolicyBundle\History\PasswordHistoryRecorder: ~

  Nowo\PasswordPolicyBundle\History\PasswordHistoryRecorderInterface:
    alias: Nowo\PasswordPolicyBundle\History\PasswordHistoryRecorder

  Nowo\PasswordPolicyBundle\Subject\DefaultPasswordPolicySubjectResolver: ~

  Nowo\PasswordPolicyBundle\Subject\PasswordPolicySubjectResolverInterface:
    alias: Nowo\PasswordPolicyBundle\Subject\DefaultPasswordPolicySubjectResolver

  Nowo\PasswordPolicyBundle\Subject\DefaultPasswordHashVerifier:
    arguments:
      $passwordHasherFactory: '@?security.password_hasher_factory'

  Nowo\PasswordPolicyBundle\Subject\PasswordHashVerifierInterface:
    alias: Nowo\PasswordPolicyBundle\Subject\DefaultPasswordHashVerifier

  Nowo\PasswordPolicyBundle\Subject\PasswordReuseChecker:
    arguments:
      $configService: '@Nowo\PasswordPolicyBundle\Service\PasswordPolicyConfigurationService'

  Nowo\PasswordPolicyBundle\Subject\PasswordReuseCheckerInterface:
    alias: Nowo\PasswordPolicyBundle\Subject\PasswordReuseChecker

  # Expiry of a non-entity security user (since 1.12.0). Default: no subject (only entity users are checked). Alias the
  # interface to TokenPasswordPolicySubjectProvider or to your own provider to opt in.
  Nowo\PasswordPolicyBundle\Subject\NullCurrentPasswordPolicySubjectProvider: ~

  Nowo\PasswordPolicyBundle\Subject\TokenPasswordPolicySubjectProvider:
    arguments:
      $tokenStorage: '@?security.token_storage'

  Nowo\PasswordPolicyBundle\Subject\CurrentPasswordPolicySubjectProviderInterface:
    alias: Nowo\PasswordPolicyBundle\Subject\NullCurrentPasswordPolicySubjectProvider

  Nowo\PasswordPolicyBundle\Service\PasswordExpiryCheckerInterface:
    alias: Nowo\PasswordPolicyBundle\Service\PasswordExpiryService

  # GDPR personal-data ports (erasure / export); the UserKit adapters are registered by the extension.
  Nowo\PasswordPolicyBundle\PersonalData\PasswordPolicyPersonalDataEraser:
    arguments:
      $managerRegistry: '@?doctrine'

  Nowo\PasswordPolicyBundle\PersonalData\PasswordPolicyPersonalDataEraserInterface:
    alias: Nowo\PasswordPolicyBundle\PersonalData\PasswordPolicyPersonalDataEraser
    public: true

  Nowo\PasswordPolicyBundle\PersonalData\PasswordPolicyPersonalDataExporter: ~

  Nowo\PasswordPolicyBundle\PersonalData\PasswordPolicyPersonalDataExporterInterface:
    alias: Nowo\PasswordPolicyBundle\PersonalData\PasswordPolicyPersonalDataExporter
    public: true

  Nowo\PasswordPolicyBundle\PersonalData\DefaultPasswordPolicyPersonalDataSubjectResolver: ~

  Nowo\PasswordPolicyBundle\PersonalData\PasswordPolicyPersonalDataSubjectResolverInterface:
    alias: Nowo\PasswordPolicyBundle\PersonalData\DefaultPasswordPolicyPersonalDataSubjectResolver
